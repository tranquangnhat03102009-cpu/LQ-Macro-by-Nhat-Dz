name: Build LQ Macro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o LQ-Macro-by-Nhat-Dz-source.zip -d project

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          patch = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "android {\n" not in s:
              raise SystemExit("Cannot find android block")

          s = s.replace("android {\n", patch + "\n", 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LQ-Macro-by-Nhat-Dz-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
